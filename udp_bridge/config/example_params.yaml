# Example configuration for udp_bridge_node
# This file demonstrates the nested parameter structure required to configure remotes and connections.

/**:
  ros__parameters:
    # Name used when communicating with remotes. Should be unique in the network.
    # Defaults to the ROS 2 node name if not set.
    name: "shoreside_bridge"

    # UDP port number used to listen for incoming data.
    port: 4200

    # Maximum packet size to use when sending data (issue #58).
    #
    # Sized for a tunnelled link, not for the IPv4/UDP maximum. WireGuard
    # over cellular here runs MTU 1280 => 1252 bytes of usable UDP payload;
    # 1200 fits with headroom. A larger value is IP-fragmented by the kernel
    # before it reaches the link, and IP fragments cannot be repaired by
    # udp_bridge's resend machinery — one lost fragment discards the whole
    # datagram. Raise only for a path whose end-to-end MTU is verified.
    maximum_packet_size: 1200

    # Reorder/jitter buffer hold window in milliseconds (issue #35). Global
    # (not per-topic; per-topic tuning is deferred to #34). 0.0 = disabled
    # (the default; behaviour identical to a pure drop_stale_packets gate).
    # When > 0 — and only while drop_stale_packets is true — a packet that
    # opens a sequence gap is held up to this long so an out-of-order
    # gap-filler that arrives within the window can be published first,
    # instead of the late arrival being hard-dropped. Clamped to 0–500 ms.
    reorder_hold_window_ms: 0.0

    # List of initial remote nodes to connect to. Each entry does two jobs
    # at once: it spells that remote's parameter paths below
    # (remotes.<entry>.connections_list) AND it IS the name that remote
    # calls itself on the wire -- that bridge's own `name` parameter, which
    # it stamps into every packet it sends.
    #
    # So: YOUR LABEL FOR A PEER MUST BE THE NAME THAT PEER CALLS ITSELF.
    #
    # That name is the remote's identity everywhere it matters, including
    # the relay loop rule ("never send a message back to the remote it came
    # from"), which compares it against the sender name on the wire.
    # Getting it wrong means the hub does not recognise that remote's own
    # traffic and can relay it back to it; the bridge WARNs when it receives
    # a packet from a name matching no configured remote. An entry that is
    # empty, longer than 23 characters, or equal to this bridge's own `name`
    # fails startup.
    #
    # Because an entry is also a ROS 2 parameter-path segment, and ROS 2
    # separates path segments with `.`, a peer whose wire name contains a
    # `.` can still be configured, but only by nesting its parameters as
    # though the dot were a level boundary -- remotes_list: ["boat.one"]
    # with `remotes:` / `boat:` / `one:` rather than a literal `boat.one:`
    # key. That resolves correctly, but the file then reads as a nested
    # structure rather than as one peer, so prefer names without a `.`.
    # (Before issue #67 the flat form was reachable via a separate
    # remotes.<label>.name key. That key is
    # REMOVED: a non-empty value now fails startup outright, whatever it is
    # set to -- even a value equal to its own entry. Delete it. An
    # explicitly empty value is indistinguishable from an absent key and is
    # accepted. Renaming an entry takes effect only in a fresh process:
    # restart the node rather than re-configuring a running one.)
    #
    # Listing a SECOND remote here also turns this bridge into a relay hub.
    # A topic received from one remote is forwarded to every OTHER remote
    # whose topics_list names that hub-local topic as its `source:`. Only
    # the RECEIVING remote has to list it; the sender need not appear in
    # that topic's routing table at all. See the commented operator_1 block
    # at the end of this file, and doc/relay_design.md.
    remotes_list: ["robot_a"]

    remotes:
      robot_a:  # The remote: this bridge knows it as "robot_a" on the
                # wire, and that is what robot_a's own `name` parameter
                # must be set to. (Matches the operator_1 block below.)

        # List of named connections to this remote.
        connections_list: ["telemetry"]

        connections:
          telemetry:
            # Host IP or hostname of the remote.
            host: "192.168.1.101"

            # Port the remote is listening on.
            port: 4200

            # Optional: Host/Port for the return connection (if different from detected source)
            # return_host: "192.168.1.100"
            # return_port: 4200

            # Data rate limit for this connection, in BYTES per second (not
            # bits). 0 means the built-in default of 50000 B/s
            # (Connection::default_rate_limit), which is far below the
            # 500000 set here -- do not read the value below as "the
            # default". 500000 is the socket buffer size, a different
            # quantity that this comment used to conflate with the default.
            maximum_bytes_per_second: 500000

            # Maximum fraction of MEASURED GOODPUT that resend traffic may
            # consume (issues #44/#52; see doc/resend_budget_design.md).
            resend_budget_fraction: 0.25

            # Absolute floor of the AIMD-adjusted admission cap, bytes/second
            # (issue #52; see doc/admission_control_design.md). Sized to keep
            # the control tier and the BridgeInfo feedback loop alive. Was a
            # fraction of the rate limit under #43, which floored six times
            # above capacity on a degraded link.
            admission_floor_bytes_per_second: 8192.0

            # Fraction of measured goodput deliberately left unused, so a
            # co-tenant on the same path (an SSH session, operator management
            # traffic) is not starved (issue #52). This, not the absolute
            # rate limit, is what keeps a degraded link usable by others.
            link_headroom_fraction: 0.2

            # List of topics to forward over this connection.
            topics_list: ["/robot_a/odometry", "/robot_a/battery"]

            topics:
              /robot_a/odometry:
                # Source topic on this machine.
                source: "/odometry"
                # Destination topic on the remote machine.
                destination: "/shoreside/robot_a/odometry"
                # Target period (seconds) to limit update rate. 0.0 = forward all.
                period: 0.0
                # Queue size for the subscriber.
                queue_size: 10
                # Optional per-topic send cap, in BYTES per second of
                # offered message payload. 0 (the default, and what
                # leaving the key out means) is unlimited -- the
                # behaviour every config had before this existed.
                #
                # Set it on the topics that can take the whole link. The
                # connection-level maximum_bytes_per_second above is
                # metered first-come-first-served with no notion of
                # topic, so one busy topic (a camera, a bulk sonar feed)
                # can consume the whole admitted budget and everything
                # else on the connection is shed as a side effect.
                #
                # Size it against the topic's own offered rate, which is
                # TopicStatistics.message_bytes_per_second in
                # ~/topic_statistics -- the same units. A topic over its
                # cap is dropped and counted there, so the shedding is
                # visible rather than silent. Live-tunable with
                # `ros2 param set`.
                maximum_bytes_per_second: 0

              /robot_a/battery:
                source: "/battery_state"
                destination: "/shoreside/robot_a/battery_state"
                period: 1.0  # Limit to 1Hz

      # ----------------------------------------------------------------
      # Second remote (commented out): what a relay hub looks like.
      #
      # Add "operator_1" to remotes_list above to enable it. With both
      # remotes configured, this bridge is a hub:
      #
      #     robot_a  ---->  this bridge  ---->  operator_1
      #
      # There is no relay parameter. The topics_list below IS the routing
      # table: operator_1 receives exactly the topics it lists, whether
      # they were published locally or arrived from robot_a.
      #
      # With the lists below, the hub relays:
      #
      #   - /shoreside/robot_a/odometry  -> operator_1, because operator_1
      #     lists that topic as its `source:`. That is the whole condition:
      #     only the RECEIVING remote has to carry the topic. robot_a's own
      #     topics_list keys this bridge's routing table on robot_a's
      #     `source:` names (/odometry), never on /shoreside/robot_a/
      #     odometry, so the two remotes share no routing-table key here --
      #     and relay happens anyway.
      #
      # ...and does NOT relay:
      #
      #   - /shoreside/robot_a/battery_state -> operator_1 does not list
      #     it, so it stops here. Relay follows the routing table and
      #     nothing else.
      #   - anything back to robot_a. A message is never sent back to the
      #     remote it came from (the loop rule).
      #
      # Note the direction of the topic names: on the hub, the topic
      # relayed to operator_1 is the topic the hub itself publishes/knows
      # -- i.e. robot_a's DESTINATION topic -- not robot_a's source name.
      #
      # As above, "operator_1" is what that bridge calls itself on the
      # wire, not just a local nickname for it.
      #
      # Star topologies only: operator_1 must not also have a route back
      # to robot_a. The bridge knows only the last hop, so a cycle
      # (A -> B -> C -> A) would circulate a message indefinitely. See
      # doc/relay_design.md.
      #
      # operator_1:
      #   connections_list: ["wan"]
      #   connections:
      #     wan:
      #       host: "203.0.113.20"
      #       port: 4200
      #       # Size this for the relayed load as well as any locally
      #       # published traffic -- relayed messages are metered by the
      #       # same admission control (doc/admission_control_design.md).
      #       maximum_bytes_per_second: 500000
      #       topics_list: ["/shoreside/robot_a/odometry"]
      #       topics:
      #         /shoreside/robot_a/odometry:
      #           source: "/shoreside/robot_a/odometry"
      #           destination: "/robot_a/odometry"
      #           # Rate limiting applies to relayed traffic identically to
      #           # locally published traffic -- same code, same state.
      #           period: 0.5
      #           queue_size: 10
